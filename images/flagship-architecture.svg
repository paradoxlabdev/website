<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F2A33C"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#0C0B09"/>

  <!-- UI -->
  <rect x="40" y="180" width="240" height="120" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
  <text x="160" y="232" fill="#EDE8DC" font-size="24" font-weight="700" text-anchor="middle">Next.js 16</text>
  <text x="160" y="264" fill="#A69E8C" font-size="18" text-anchor="middle">React 19 UI</text>

  <!-- Core -->
  <rect x="380" y="120" width="380" height="240" rx="10" fill="#171410" stroke="#F2A33C" stroke-width="1.5"/>
  <text x="570" y="168" fill="#F2A33C" font-size="24" font-weight="700" text-anchor="middle">Unified trading core</text>
  <text x="570" y="206" fill="#EDE8DC" font-size="18" text-anchor="middle">4 signing models</text>
  <text x="570" y="240" fill="#A69E8C" font-size="17" text-anchor="middle">EOA &#183; Account Kit AA</text>
  <text x="570" y="270" fill="#A69E8C" font-size="17" text-anchor="middle">EIP-1271 &#183; agent-wallet</text>
  <text x="570" y="318" fill="#A69E8C" font-size="15" text-anchor="middle">reconnects &#183; retries &#183; reconciliation</text>

  <!-- Copy engine -->
  <rect x="360" y="412" width="420" height="120" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
  <text x="570" y="452" fill="#EDE8DC" font-size="20" font-weight="700" text-anchor="middle">Copy-Trading Engine</text>
  <text x="570" y="484" fill="#A69E8C" font-size="15" text-anchor="middle">Polymarket WS &#8594; FIFO PnL</text>
  <text x="570" y="510" fill="#A69E8C" font-size="15" text-anchor="middle">mirror in ~3&#8211;5 s</text>

  <!-- Protocols -->
  <g>
    <rect x="850" y="52" width="360" height="96" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
    <text x="1030" y="94" fill="#EDE8DC" font-size="21" font-weight="700" text-anchor="middle">Myriad</text>
    <text x="1030" y="126" fill="#A69E8C" font-size="15" text-anchor="middle">hybrid AMM + CLOB &#183; HMAC delegated</text>

    <rect x="850" y="192" width="360" height="96" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
    <text x="1030" y="234" fill="#EDE8DC" font-size="21" font-weight="700" text-anchor="middle">Limitless</text>
    <text x="1030" y="266" fill="#A69E8C" font-size="15" text-anchor="middle">binary options AMM &#183; CLOB path</text>

    <rect x="850" y="332" width="360" height="96" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
    <text x="1030" y="374" fill="#EDE8DC" font-size="21" font-weight="700" text-anchor="middle">Hyperliquid</text>
    <text x="1030" y="406" fill="#A69E8C" font-size="15" text-anchor="middle">non-EVM L1 &#183; 1200-weight/min WS book</text>
  </g>

  <!-- Chains -->
  <rect x="1300" y="165" width="260" height="150" rx="10" fill="#171410" stroke="rgba(97,194,133,.5)" stroke-width="1.5"/>
  <circle cx="1345" cy="207" r="5" fill="#61C285"/>
  <text x="1362" y="214" fill="#61C285" font-size="19" font-weight="700">5 chains</text>
  <text x="1430" y="252" fill="#A69E8C" font-size="16" text-anchor="middle">LiFi deposits</text>
  <text x="1430" y="282" fill="#A69E8C" font-size="16" text-anchor="middle">swap-on-trade collateral</text>

  <!-- Arrows -->
  <line x1="280" y1="240" x2="372" y2="240" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="760" y1="180" x2="842" y2="110" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="760" y1="240" x2="842" y2="240" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="760" y1="300" x2="842" y2="372" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="412" x2="570" y2="364" stroke="#F2A33C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <line x1="1210" y1="240" x2="1292" y2="240" stroke="rgba(97,194,133,.7)" stroke-width="2" marker-end="url(#ar)"/>
</svg>
