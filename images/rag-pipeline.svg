<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F2A33C"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="#0C0B09"/>

  <rect x="40" y="120" width="310" height="160" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
  <text x="195" y="170" fill="#EDE8DC" font-size="21" font-weight="700" text-anchor="middle">Product catalogues</text>
  <text x="195" y="206" fill="#A69E8C" font-size="15" text-anchor="middle">216 + 208 pages</text>
  <text x="195" y="234" fill="#A69E8C" font-size="15" text-anchor="middle">DTP-set PDF &#183; full scan</text>

  <rect x="430" y="95" width="380" height="210" rx="10" fill="#171410" stroke="#F2A33C" stroke-width="1.5"/>
  <text x="620" y="143" fill="#F2A33C" font-size="21" font-weight="700" text-anchor="middle">Measured extraction</text>
  <text x="620" y="181" fill="#EDE8DC" font-size="15" text-anchor="middle">pdftotext over pdfjs</text>
  <text x="620" y="208" fill="#A69E8C" font-size="15" text-anchor="middle">8.2% &#8594; 0.09% garbled</text>
  <text x="620" y="240" fill="#A69E8C" font-size="15" text-anchor="middle">per-page OCR routing</text>
  <text x="620" y="267" fill="#A69E8C" font-size="15" text-anchor="middle">grid-page detection &#8594; vision</text>

  <rect x="890" y="120" width="330" height="160" rx="10" fill="#1A1712" stroke="rgba(242,163,60,.35)" stroke-width="1.5"/>
  <text x="1055" y="170" fill="#EDE8DC" font-size="21" font-weight="700" text-anchor="middle">PostgreSQL + pgvector</text>
  <text x="1055" y="206" fill="#A69E8C" font-size="15" text-anchor="middle">sentence &#8594; line &#8594; word chunks</text>
  <text x="1055" y="234" fill="#A69E8C" font-size="15" text-anchor="middle">hybrid search</text>

  <rect x="1300" y="120" width="260" height="160" rx="10" fill="#171410" stroke="rgba(97,194,133,.5)" stroke-width="1.5"/>
  <circle cx="1348" cy="165" r="5" fill="#61C285"/>
  <text x="1365" y="172" fill="#61C285" font-size="19" font-weight="700">agent</text>
  <text x="1430" y="208" fill="#A69E8C" font-size="15" text-anchor="middle">Mastra &#183; thread memory</text>
  <text x="1430" y="236" fill="#A69E8C" font-size="15" text-anchor="middle">grounded citations</text>

  <line x1="350" y1="200" x2="422" y2="200" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="810" y1="200" x2="882" y2="200" stroke="#F2A33C" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1220" y1="200" x2="1292" y2="200" stroke="rgba(97,194,133,.7)" stroke-width="2" marker-end="url(#ar)"/>
